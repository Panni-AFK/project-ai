  <rect width="800" height="1000" fill="url(#pbg)" />

  <circle cx="400" cy="392" r="292" fill="#e3ded2" />
  <circle cx="400" cy="392" r="292" fill="none" stroke="#d3ccbb" stroke-width="1" />

